<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Awuuu drag: edge behaviours</title>
<style>
  html,body{margin:0;height:100%;background:#14110e;color:#eee;font:14px system-ui;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;touch-action:none;cursor:grab}
  #ui{position:fixed;left:12px;bottom:12px;background:#000a;padding:10px 12px;border-radius:10px;display:grid;gap:6px;max-width:92vw}
  label{display:flex;gap:8px;align-items:center}select,input{accent-color:#e8a24a}
</style>
<canvas id="c"></canvas>
<div id="ui">
  <label>Edge style
    <select id="mode">
      <option value="morph">1 Morph into the docked tab</option>
      <option value="sink">2 Sink half into the edge</option>
      <option value="gum">3 Gum: stick and stretch</option>
      <option value="squash">4 Squash flat (current)</option>
    </select></label>
  <label>Reach <input id="reach" type="range" min="1.5" max="5" step=".1" value="3"></label>
  <label>Size <input id="size" type="range" min="50" max="200" value="120"></label>
  <div>Drag the dog ball to any edge, let go.</div>
</div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,dpr;function fit(){dpr=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}fit();addEventListener('resize',fit);
const $=id=>document.getElementById(id);
const smooth=t=>t*t*(3-2*t),clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),lerp=(a,b,t)=>a+(b-a)*t;
let pos={x:W/2,y:60},vel={x:0,y:0},cur={x:W/2,y:60},drag=false,grab={x:0,y:0},settle=null,heldAt=0;
const R=()=>$('size').value/2;
cv.onpointerdown=e=>{const d=Math.hypot(e.clientX-pos.x,e.clientY-pos.y);if(d>R()*1.4)return;
  drag=true;settle=null;grab={x:e.clientX-pos.x,y:e.clientY-pos.y};heldAt=performance.now();cv.setPointerCapture(e.pointerId)};
cv.onpointermove=e=>{cur={x:e.clientX,y:e.clientY}};
cv.onpointerup=()=>{if(!drag)return;drag=false;const n=nearest(pos.x,pos.y);settle={t0:performance.now(),from:{...pos},edge:n.e}};
function nearest(x,y){const c=[{e:'top',d:y},{e:'bottom',d:H-y},{e:'left',d:x},{e:'right',d:W-x}];return c.reduce((a,b)=>b.d<a.d?b:a)}
// the dog: round face, ears, eyes that look where the ball goes
function dog(x,y,r,lx,ly){g.save();g.translate(x,y);
  g.fillStyle='#d98a3d';g.beginPath();g.arc(0,0,r*.62,0,7);g.fill();
  g.fillStyle='#b8692a';for(const s of[-1,1]){g.beginPath();g.ellipse(s*r*.5,-r*.42,r*.2,r*.3,s*.5,0,7);g.fill()}
  g.fillStyle='#fff';g.beginPath();g.ellipse(0,r*.12,r*.34,r*.26,0,0,7);g.fill();
  g.fillStyle='#111';for(const s of[-1,1]){g.beginPath();g.arc(s*r*.22+lx*r*.05,-r*.06+ly*r*.05,r*.07,0,7);g.fill()}
  g.beginPath();g.ellipse(lx*r*.03,r*.08+ly*r*.03,r*.08,r*.055,0,0,7);g.fill();g.restore()}
function ball(x,y,sx,sy,rad,lx,ly,r){ // rounded blob scaled sx,sy
  g.save();g.translate(x,y);g.fillStyle='#120f0c';g.strokeStyle='#ffffff22';g.lineWidth=1.5;
  g.shadowColor='#0009';g.shadowBlur=24;g.shadowOffsetY=8;
  g.beginPath();g.roundRect(-sx/2,-sy/2,sx,sy,rad);g.fill();g.shadowColor='transparent';g.stroke();g.restore();
  dog(x,y,r,lx,ly)}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;const r=R(),mode=$('mode').value,REACH=r*$('reach').value;
  g.clearRect(0,0,W,H);
  // faint screen edge glow while carried
  if(drag){const n=nearest(pos.x,pos.y);const t=smooth(clamp(1-n.d/REACH,0,1));g.fillStyle=`rgba(232,162,74,${.25*t})`;
    if(n.e=='top')g.fillRect(0,0,W,6);if(n.e=='bottom')g.fillRect(0,H-6,W,6);if(n.e=='left')g.fillRect(0,0,6,H);if(n.e=='right')g.fillRect(W-6,0,6,H)}
  let t=0,edge='top';
  if(settle){const k=clamp((now-settle.t0)/260,0,1);edge=settle.edge;t=1;
    const e=1-Math.pow(1-k,3);const tgt=target(edge,settle.from,r,mode,1);pos.x=lerp(settle.from.x,tgt.x,e);pos.y=lerp(settle.from.y,tgt.y,e)}
  else if(drag){const held=Math.pow(1-clamp((now-heldAt)/180,0,1),3),ax=cur.x-grab.x*held,ay=cur.y-grab.y*held,f=Math.min(1,dt*18);
    const nx=pos.x+(ax-pos.x)*f,ny=pos.y+(ay-pos.y)*f;vel={x:vel.x*.8+(nx-pos.x)/Math.max(dt,.001)*.2,y:vel.y*.8+(ny-pos.y)/Math.max(dt,.001)*.2};
    pos={x:clamp(nx,0,W),y:clamp(ny,0,H)};const n=nearest(pos.x,pos.y);edge=n.e;t=smooth(clamp(1-(n.d-r*.4)/(REACH-r*.4),0,1));
    const tg=target(edge,pos,r,mode,t);pos={x:tg.x,y:tg.y}}
  else vel={x:vel.x*.85,y:vel.y*.85};
  const sp=Math.hypot(vel.x,vel.y),stretch=drag&&!settle&&mode!='squash'?1+Math.min(.18,sp/4000):1,ang=Math.atan2(vel.y,vel.x);
  const lx=clamp(vel.x/500,-1,1),ly=clamp(vel.y/500,-1,1);
  g.save();
  if(mode!='squash'&&stretch>1.01){g.translate(pos.x,pos.y);g.rotate(ang);g.scale(stretch,1/stretch);g.rotate(-ang);g.translate(-pos.x,-pos.y)}
  draw(mode,edge,t,r,lx,ly);g.restore();requestAnimationFrame(frame)}
// where the centre goes as t→1
function target(edge,p,r,mode,t){let d={top:p.y,bottom:H-p.y,left:p.x,right:W-p.x}[edge],want;
  if(mode=='sink')want=r*(1-.85*1);else if(mode=='gum')want=r*.95;else if(mode=='morph')want=r*.28;else want=r*.4;
  const nd=lerp(d,want,t),s={top:[p.x,nd],bottom:[p.x,H-nd],left:[nd,p.y],right:[W-nd,p.y]}[edge];return{x:s[0],y:s[1]}}
function draw(mode,edge,t,r,lx,ly){const x=pos.x,y=pos.y,horiz=edge=='top'||edge=='bottom',hs=(edge=='top'||edge=='left')?1:-1;
  if(mode=='morph'){ // circle → the flat tab the island docks as
    const w=lerp(2*r,2*r*1.9,t),h=lerp(2*r,Math.max(26,r*.5),t);const sx=horiz?w:h,sy=horiz?h:w;
    ball(x,y,sx,sy,Math.min(sx,sy)/2,lx,ly,r*lerp(1,.5,t))}
  else if(mode=='sink'||mode=='squash'){const p=mode=='squash'?t*.6:0,par=mode=='squash'?1+.35*t:1;
    ball(x,y,horiz?2*r*par:2*r*(1-p),horiz?2*r*(1-p):2*r*par,r*(1-p),lx,ly,r*(1-p*.6))}
  else{ // gum: round ball + a contact patch to the edge that widens as it nears
    const ex=horiz?x:(edge=='left'?0:W),ey=horiz?(edge=='top'?0:H):y;g.save();g.fillStyle='#120f0c';g.strokeStyle='#ffffff22';g.shadowColor='#0009';g.shadowBlur=24;g.shadowOffsetY=8;
    const pw=r*(.3+1.1*t);g.beginPath();
    if(horiz){g.moveTo(x-pw,ey);g.quadraticCurveTo(x-pw*.5,(y+ey)/2,x-r*.6,y);g.lineTo(x+r*.6,y);g.quadraticCurveTo(x+pw*.5,(y+ey)/2,x+pw,ey)}
    else{g.moveTo(ex,y-pw);g.quadraticCurveTo((x+ex)/2,y-pw*.5,x,y-r*.6);g.lineTo(x,y+r*.6);g.quadraticCurveTo((x+ex)/2,y+pw*.5,ex,y+pw)}
    g.closePath();if(t>.02)g.fill();g.shadowColor='transparent';g.beginPath();g.arc(x,y,r,0,7);g.fillStyle='#120f0c';g.fill();g.stroke();g.restore();dog(x,y,r,lx,ly)}}
requestAnimationFrame(frame);
</script>
